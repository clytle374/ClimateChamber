[env:ATmega644P]
platform = atmelavr
board = ATmega644P
framework = arduino

board_build.mcu = atmega644p
board_build.f_cpu = 20000000L
board_build.variant = standard

platform_packages =
    platformio/framework-arduino-avr-mightycore@^3.1.0

; ===== Libraries =====
lib_deps =
    olikraus/U8g2                    ; for U8x8lib.h
    Dlloydev/QuickPID
    Stutchbury/EncoderButton
    paulstoffregen/Time              ; TimeLib.h
    robtillaart/RunningAverage
    ; Wire, SPI, EEPROM are already included with the Arduino framework
lib_ignore =
    Wire1

upload_protocol = stk500v2
upload_flags =
    -P$UPLOAD_PORT
    -B5
    -e
monitor_speed = 115200
monitor_port = /dev/ttyACM1
